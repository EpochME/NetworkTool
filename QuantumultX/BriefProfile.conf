#Quantumult X 在 iOS 上本身就是基于 TUN （虚拟 VPN 隧道）模式运行的，没有像小火箭那样“代理类型：HTTP / none（TUN）”的切换选项。开启后系统层面就是完整的 Packet Tunnel，效果已经接近小火箭把代理类型设为 none 的状态。
[general]
# 网络连通性检测
# - 检测设备是否正常访问网络
# - 使用苹果官方页面，返回 HTTP 200（Success）
# - 场景：验证本地网络，调试链式代理
# - 建议：用稳定 URL（如 http://bing.com）
# - 注意：确保不被分流规则拦截，仅用于设备网络诊断
network_check_url = http://www.apple.com/library/test/success.html


# 节点可用性测试
# - 功能：
#   - 测试所有代理节点（[server_local] 和 [server_remote]）的连通性和延迟
#   - 返回 TCP 握手延迟（客户端与服务器连接时间）和 HTTP 延迟（发送请求到响应时间，主界面显示）
#   - 闪电图标表示 TCP 快速打开（fast-open）成功
# - 测试 URL：使用 Cloudflare 的 http://cp.cloudflare.com/generate_204（返回 HTTP 204 状态码，无内容）
# - 测试时间间隔：
#   - 由 [policy] 中策略组的 interval 参数控制，单位为秒，默认 600 秒（10 分钟）
#   - 示例：interval=600 表示每 10 分钟测试一次；可调整为 300（5 分钟）或 1200（20 分钟）以平衡频率和负载
#   - 影响节点：[server_local] 和 [server_remote] 中的所有节点（如 LocalVPS、Airport 子节点）
# - 场景：
#   - 配合 url-latency-benchmark，动态选择低延迟节点
#   - 测试链式代理（如 LocalVPS 154.28.105.46 -> Airport）
# - 建议：
#   - 使用快速响应 URL（如 http://www.google.com/generate_204）以提高测试效率
#   - 调整 server_check_timeout（默认 2000 毫秒）以适配跨国节点
# - 注意事项：
#   - 无需为 server_check_url 的域名（如 cp.cloudflare.com）设置分流规则，Quantumult X 自动通过每个节点测试
#   - 如果节点属于多个策略组，Quantumult X 会根据每个策略组的 interval 参数独立执行测试。检查 [policy] 中其他策略组的 interval 参数，确保所有节点的测试间隔一致。过短的间隔可能增加网络负载，建议根据需求平衡（300-1200 秒较常见）。
#   - 节点自定义 server_check_url（在 [server_local]/[server_remote]）优先于全局配置
#   - Trojan 协议无响应校验，HTTP 测试可能不准确
#   - 确保 cp.cloudflare.com 的 IP 不在 excluded_routes（如 10.0.0.0/8）中，避免直连影响测试
#   - 使用 DoH 解析（如 1.1.1.1）确保 DNS 稳定性
server_check_url = http://cp.cloudflare.com/generate_204


# 节点测试 User-Agent
# - 自定义测试请求 User-Agent，模拟特定客户端
# - 场景：适配敏感服务器，结合 jq 伪装（如 iPhone）
# - 建议：默认 Agent/1.0 够用，可用 Mozilla/5.0 模拟浏览器
# - 注意：除非服务器要求特定 User-Agent，无需修改
server_check_user_agent = Agent/1.0


# 节点测试超时时间（毫秒）
# - 控制 DNS 查询、TCP/TLS 握手、HTTP 会话超时，≤ 5000ms 有效
# - 配合 server_check_url（http://cp.cloudflare.com/generate_204）测试
# - 2000ms（2秒）内无响应，标记不可用，可能切换节点
# - 健康检查：定期访问 server_check_url，超 2000ms 触发切换
# - 影响：用于 [policy] 的 url-latency-benchmark，选择低延迟节点
# - 优点：2秒超时快速剔除慢节点，提升体验
# - 问题：跨国节点（如 154.28.105.46，美国弗吉尼亚州）或不佳网络下，2秒可能不足
# - 场景：优化链式代理，筛选低延迟节点
# - 建议：
#   - 高延迟环境设 3000-4000ms
#   - 配合 url-latency-benchmark（间隔 600秒，容差 0）避免频繁切换
#   - 结合 geo_location_checker 验证节点位置
# - 注意：实际延迟可能超 TCP 和 HTTP 延迟总和
server_check_timeout = 2000


# 地理位置检查
# - 设置 URL 和脚本，获取/处理节点地理数据（如 “美国 弗吉尼亚州”）
# - URL：返回 JSON（如 ip-api.com 的 {"country":"美国","city":"阿什本"}）
# - 脚本：解析 JSON，确定节点位置，支持 jq（1.5.2）
# - 场景：选择低延迟节点，验证 VPS（如 154.28.105.46）
# - 建议：用可靠 API（如 http://ipinfo.io/json），检查脚本可访问性
# - 注意：脚本需支持 jq，常用于节点选择优化
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/I-am-R-E/Functional-Store-Hub/Master/GeoLocationChecker/QuantumultX/IP-API.js


# 资源解析器脚本
# - 转换 V2Ray、Shadowsocks、Trojan、Surge、Clash 等为 Quantumult X 格式
# - 支持：
#   - 节点筛选/重命名（in/out/regex/rename，如 in=香港+台湾）
#   - 规则转换：Surge/Clash 规则集/模块转分流/重写
#   - 高级功能：正则、流量通知、sfilter/srename、链式代理（via=%TUN%）
# - 示例：#emoji=1&tfo=1&in=香港+台湾
# - 场景：转换 Clash 订阅，筛选香港节点，结合 jq 处理
# - 建议：用 KOP-XIAO 稳定脚本，参考参数（如 sort=🇭🇰>🇸🇬）
# - 注意：需兼容 1.5.2 的 jq，定期检查 URL 可访问性
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js


# 排除路由：用于指定不通过 Quantumult X 的代理处理（包括 TUN 模式）的 IP 地址范围（以 CIDR 格式表示）。这些 IP 范围将直接通过设备的本地网络（如 Wi-Fi 或移动数据）访问和（直连，direct）处理
# - 作用：确保局域网设备、企业内网、特定服务（如 Apple 服务）或多播流量不通过代理，降低延迟和负载
# - IP 范围说明：
#   - 192.168.0.0/16：私有 IP，家庭或小型办公室局域网，典型设备包括路由器（192.168.1.1）、电脑、手机、智能家居（如智能灯、摄像头）
#   - 10.0.0.0/8：私有 IP，大型企业内网、VPN 或云服务内部网络，典型设备包括企业服务器、VPN 客户端
#   - 17.0.0.0/8：Apple 专用公网 IP，用于 iCloud、App Store、FaceTime 等服务，确保 Apple 设备和服务低延迟
#   - 172.16.0.0/12：私有 IP，中型企业网络或云服务内部网络，典型设备包括服务器、路由器、容器网络（如 Docker）
#   - 100.64.0.0/10：CGNAT 地址，运营商级 NAT 网络，典型设备为 ISP 分配的客户端（如家庭宽带网关）
#   - 239.255.255.250/32：多播地址，用于 UPnP/SSDP，典型设备为智能家居、媒体播放器、打印机的服务发现
# - 注意事项：
#   - 确保 server_check_url（如 cp.cloudflare.com，IP 如 104.16.0.0/12）或 Grok 域名（如 x.ai，IP 如 154.28.105.46）的 IP 不在 excluded_routes 中，避免测试或流量直连
#   - 仅影响 TUN 模式，重启设备确保生效
#   - 使用 nslookup 或 geo_location_checker 验证 IP（如 nslookup cp.cloudflare.com）
#   - 若 IP 被 excluded_routes 覆盖，添加 ip-cidr 规则到 [filter_local]（如 ip-cidr, 104.16.123.456/32, ProxyAll）
excluded_routes = 192.168.0.0/16, 10.0.0.0/8, 17.0.0.0/8, 172.16.0.0/12, 100.64.0.0/10, 239.255.255.250/32

# DNS 排除列表：指定dns exclusion list中的域名将不使用fake-ip方式, 而是直接解析真实 IP ,其它域名则全部采用 fake-ip 及远程解析的模式
# 示例：排除 中国移动认证服务 域名，使用 Real IP
# DNS 排除列表：指定使用系统默认 DNS 解析的域名，绕过 [dns] 中的 DoH 服务器
# - 作用：确保国内服务（如金融、认证）解析到本地服务器，降低延迟
# - 域名说明：
#   - *.cmpassport.com：中国移动认证服务
#   - *.jegotrip.com.cn：捷戈旅游服务
#   - *.icitymobile.mobi：城市移动相关服务
#   - id6.me：身份认证服务
#   - *.pingan.com.cn：平安保险服务
#   - *.cmbchina.com：招商银行服务
# - 注意事项：
#   - 确保 server_check_url（如 cp.cloudflare.com）和 Grok 域名（如 x.ai, grok.com）不在此列表，使用 DoH 解析
#   - 谨慎添加新域名，避免影响国际服务解析
dns_exclusion_list = *.cmpassport.com, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com


# 允许的 UDP 端口
# - 控制通过虚拟网卡（TUN 模式）的 UDP 端口
# - 示例：允许除 443 外的端口（1-442, 444-65535）
# - 说明：
#   - 空值允许所有 UDP 端口
#   - 不匹配端口丢弃并返回 ICMP（端口不可达）
# - 场景：确保 DNS（53）、NTP（123）通过代理
# - 建议：仅允许必要端口（如 53,123），测试 UDP 流量
# - 注意：配合 udp_drop_list 控制流量
udp_whitelist = 1-442, 444-65535

# 丢弃的 UDP 端口/协议
# - 作用：丢弃指定端口或协议的 UDP 流量，阻止特定 UDP 流量通过代理或直连，不返回 ICMP，防止泄露或干扰
# - 端口/协议说明：
#   - 443：丢弃 UDP 443 流量（常用于 HTTPS 和 QUIC）
#   - STUN：丢弃 STUN 协议流量（NAT 穿透，如 WebRTC 视频通话）
#   - QUIC：丢弃 QUIC 协议流量（基于 UDP 443，HTTP/3，如 Google Maps）
#   - 1900：丢弃 UDP 1900 流量（SSDP，UPnP 设备发现，如智能家居）
# - 功能：
#   - 阻止 QUIC（HTTP/3），强制 TCP（如 HTTPS），提高代理兼容性
#   - 阻止 STUN，防止视频/语音通话泄露（如 Zoom、WebRTC）
#   - 阻止 UPnP，防止本地设备（如路由器）暴露
# - 适用场景：
#   - 优化 Google 服务（如 Google Maps，禁用 QUIC 强制 TCP）
#   - 防止 WebRTC 泄露（如视频通话）
#   - 增强本地网络安全，防止 IoT 或 LocalVPS（192.168.1.100）暴露
# - 适配上下文：
#   - Grok 分流：
#     - 作用：屏蔽 QUIC（UDP 443），确保 x.ai 使用 TCP（HTTPS 443）通过 GrokAiPolicy 直接路由到所选节点，保护隐私
#     - 例子：
#       - 场景：用户访问 https://x.ai（xAI 官网），触发 DNS 解析（通过 [dns] 的 DoH，如 https://dns.google/dns-query）
#       - 流程：
#         1. DNS 解析 x.ai 到 154.28.105.46
#         2. udp_drop_list 屏蔽 QUIC，强制浏览器使用 HTTPS（TCP 443）而非 HTTP/3
#         3. Grok.list 规则（如 host-suffix, x.ai, GrokAiPolicy）将流量分配到 GrokAiPolicy
#         4. GrokAiPolicy 路由到所选节点（如美国节点，VMess 配置）
#         5. ISP 只看到加密流量到所选节点 IP，无法获知 x.ai 或其 IP
#       - 效果：x.ai 访问安全，适配 Grok 分流需求
#   - 节点测试：
#     - 作用：cp.cloudflare.com 使用 HTTP（TCP 80），不受 UDP 屏蔽影响，保持 server_check_url 测试正常
#     - 例子：
#       - 场景：Quantumult X 每 600 秒测试 http://cp.cloudflare.com/generate_204
#       - 流程：
#         1. DNS 解析 cp.cloudflare.com 到 104.16.123.456（通过 DoH）
#         2. 请求使用 HTTP（TCP 80），不受 udp_drop_list 影响
#         3. 流量通过 GrokAiPolicy 或 Proxy 路由到所选节点
#         4. 所选节点返回 204 状态码，确认节点正常
#       - 效果：节点测试稳定，适配 server_check_url
# - 影响范围：
#   - 443, STUN, QUIC：影响广，可能导致 Google Maps、视频通话不可用
#   - 1900：影响窄，仅限本地设备发现
# - 注意事项：
#   - 仅对 [udp_relay] 或 udp_whitelist 流量生效，需配合 [policy]（如 GrokAiPolicy）
#   - 避免屏蔽必要端口（如 DNS 53），否则影响解析
udp_drop_list = 443, STUN, QUIC, 1900


# UDP 备用策略
# - 为不支持 UDP 的节点指定处理方式
# - 示例：reject 丢弃未匹配 UDP 流量，增强安全性
# - 值：reject（默认）或支持 UDP 的节点（如 vps）
# - 场景：链式代理中指定 VPS（如 154.28.105.46:8388）处理 UDP
# - 建议：设为支持 UDP 的节点，测试 DNS 查询
# - 注意：值必须为有效节点标签，否则默认 reject
fallback_udp_policy = reject


# ICMP 自动响应
# - true 允许响应 Ping，便于网络诊断
# - 场景：调试链式代理，验证可达性（如 ping 154.28.105.46）
# - 建议：调试启用，生产环境禁用以隐藏设备
# - 注意：不影响代理功能
icmp_auto_reply = true


# DoH 请求 User-Agent
# - 自定义 DoH 请求标识，增强隐私或适配 DoH 服务
# - 场景：伪装 DoH 请求，规避审计
# - 建议：用 QuantumultX/1.5.2 或默认 Agent/1.0
# - 注意：与 server_check_user_agent 类似，通常无需修改
doh_user_agent = Agent/1.0


# DNS 拒绝行为
# - 控制分流规则中 reject 域名的 DNS 响应方式
# - 可选值：
#   - loopback（默认）：返回 127.0.0.1，防止流量泄露
#   - no-error-no-answer（无错误无答案）：返回 NOERROR NOANSWER
#   - nxdomain（域名不存在）：返回 NXDOMAIN
#   - none（禁用拒绝功能）：禁用 DNS 拒绝
# - 示例 1 ：no-error-no-answer 适合屏蔽广告
# - 示例 2 ：dns_reject_domain_behavior=nxdomain 返回 NXDOMAIN 响应，适合调试
# - 场景：结合 jq 屏蔽广告 API（如 ads.example.com）
# - 建议：用 nxdomain 拒绝敏感域名，测试 DNS 响应
# - 注意：更改拒绝状态后，TTL 为 10 秒，需等待生效
dns_reject_domain_behavior = loopback

[dns]
# 启用 Fake IP 模式（默认行为，不需显式设置）
# 禁用系统 DNS
# - 作用：强制使用 Quantumult X 配置的 DNS 服务器（如 114.114.114.114），避免系统 DNS（如 ISP 提供的 DNS）干扰，防止本地泄漏
# - 适用场景：防止 ISP DNS 拦截或篡改，确保解析一致性
# - 支持参数：excluded_ssids（如 SSID1, SSID2）指定在特定 Wi-Fi 下使用系统 DNS；included_ssids（1.0.29+）指定在特定 Wi-Fi 下生效
# - 注意事项：启用 no-system 后，必须配置至少一个 DNS 服务器（如 server=114.114.114.114）
no-system

# 禁用 IPv6 解析
# - 作用：禁止 AAAA 查询，强制所有域名解析为 IPv4 地址，防止 IPv6 地址泄露
# - 适用场景：代理节点（如 LocalVPS 192.168.1.100 或 Airport）仅支持 IPv4，或网络环境不支持 IPv6
# - 支持参数：excluded_ssids, included_ssids（1.0.29+）
# - 注意事项：可能导致不支持 IPv6 的网站（如某些 CDN）无法访问，需测试
no-ipv6

# 自定义 DNS 服务器
# - 作用：指定通用 DNS 服务器，解析非特定域名（如未被 server=/... 或 address=/... 指定的域名）
# - 解析顺序：按配置顺序尝试，优先使用第一个服务器（如 114.114.114.114），若失败则 fallback 到后续服务器
# - 支持并发查询，选取最优结果
# - 支持参数：excluded_ssids, included_ssids（如 server=114.114.114.114, excluded_ssids=SSID1）
# - server=114.114.114.114：南京信风公共 DNS，国内服务，注重速度，适合解析国内 CDN
#server=114.114.114.114
# - server=223.5.5.5：阿里公共 DNS，国内服务，注重稳定性和 CDN 优化
#server=223.5.5.5
# - server=8.8.8.8：Google 公共 DNS，全球服务，注重可靠性和隐私
server=8.8.8.8
# - server=8.8.4.4:53：Google 公共 DNS，显式指定端口 53（标准 DNS 端口），与 8.8.8.8 功能类似
server=8.8.4.4:53

# 特定域名 DNS
# - 作用：为指定域名（如 *.taobao.com）分配专用 DNS 服务器，绕过通用 DNS（如 114.114.114.114）
# - 适用场景：优化特定服务（如淘宝、天猫）的解析，确保低延迟和 CDN 适配
# - 支持通配符（如 *.taobao.com）和参数 excluded_ssids/included_ssids
# - server=/*.taobao.com/223.5.5.5：淘宝域名使用阿里 DNS，优化国内 CDN
server=/*.taobao.com/223.5.5.5
# - server=/*.tmall.com/223.5.5.5：天猫域名使用阿里 DNS，优化国内 CDN
server=/*.tmall.com/223.5.5.5
server=/*.alipay.com/223.5.5.5
server=/*.alicdn.com/223.5.5.5
server=/*.aliyun.com/223.5.5.5
server=/*.jd.com/119.28.28.28
server=/*.qq.com/119.28.28.28
server=/*.tencent.com/119.28.28.28
server=/*.weixin.com/119.28.28.28
server=/*.bilibili.com/119.29.29.29
#hdslb.com哔哩哔哩（Bilibili） 的官方 CDN（内容分发网络）域名。匹配 hdslb.com 本身 + 所有子域名•  相当于覆盖：hdslb.com, i0.hdslb.com, s1.hdslb.com, xxx.hdslb.com等等所有以 .hdslb.com 结尾的域名
server=/hdslb.com/119.29.29.29
# 小红书相关域名走国内DNS（119.29.29.29）
server=/xiaohongshu.com/119.29.29.29
server=/xhscdn.com/119.29.29.29
server=/xhscdn.net/119.29.29.29
server=/xhslink.com/119.29.29.29
server=/xhsrcdn.com/119.29.29.29
server=/xhsredcdn.com/119.29.29.29

server=/*.163.com/119.29.29.29
server=/*.126.com/119.29.29.29
server=/*.126.net/119.29.29.29
server=/*.127.net/119.29.29.29
server=/*.netease.com/119.29.29.29
server=/*.mi.com/119.29.29.29
server=/*.xiaomi.com/119.29.29.29

# DNS over HTTPS (DoH)
# - 作用：使用加密的 DoH 协议解析域名，提高隐私和安全性，绕过 ISP 拦截
# - 注意事项：
#   - 启用 DoH 后，普通 DNS 服务器（如 114.114.114.114）被忽略，但特定域名 DNS（如 *.taobao.com）仍生效
#   - 1.0.29+ 支持多 DoH 并发，仅第一个 DoH 生效
#   - 不建议在防火墙严格的网络使用，可能无法访问 DoH 服务器。Cloudflare (⁠1.1.1.1⁠) 或 Google (⁠8.8.8.8⁠) 的 DoH 服务器。在大陆境内经常遭受严重的 SNI 阻断、UDP 干扰或连接超时。GFW 对 Cloudflare DoH 的阻断很大程度上是针对域名 ⁠cloudflare-dns.com⁠ 的 TLS SNI 检查。如果直接使用 IP 形式 的 DoH 地址，可以绕过 SNI 握手特征。如果直接使用 IP 形式的DoH 地址，注意：必须取消勾选/禁用 ⁠prefer-doh3⁠。因为国内运营商对 Cloudflare 的 UDP 443/853 端口干扰极重（大量丢包/超时），退回到基于 TCP 的 HTTP/2 传输反而更稳定。通过代理节点进行“节点接管” (Proxy Remote DNS)。cloudflare-dns.com⁠ 是 Cloudflare 官方的公共 DNS/DoH 域名，属于全球通用服务. https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Cloudflare/Cloudflare.list分流规则是 Cloudflare 官方全集规则，收录了其全球范围内的核心域名、子域名（匹配模式通常为 ⁠HOST-SUFFIX, cloudflare-dns.com⁠ 或通配符匹配 ⁠cloudflare.com⁠）以及关联 IP。因此，⁠cloudflare-dns.com⁠ 已被完整覆盖. 在 Quantumult X 中，如果坚决要用 (https://cloudflare-dns.com/dns-query)⁠，最彻底的解决办法是让这个 DoH 请求本身也走代理。只要把解析 DoH 服务器的流量丢给代理节点，阻断和干扰就完全不存在了。优点：100% 解决墙的干扰，体验最纯粹、最无污染的 Cloudflare DNS。缺点：如果代理节点掉线，那么全局 DNS 解析就会彻底挂掉（循环依赖问题）。不建议在节点不稳定的情况下使用。在 Quantumult X 的“网络活动”（Network Activity / 抓包日志）中看不到 ⁠cloudflare-dns.com⁠ 的分流日志，属于完全正常的底层设计现象。在 App 内部启动 DoH（⁠doh-server⁠）时，系统面临一个逻辑悖论：“要通过 DoH 解析域名，首先必须知道 DoH 域名（⁠cloudflare-dns.com⁠）本身的 IP；但此时系统还没有可用 DNS，怎么去解析它？”为了避免这个“先有鸡还是先有蛋”的悖论：1. Quantumult X 会在 App 内部独立建立一条底层的 TLS 通道去连接 DoH 服务器。2. 这一过程发生在 DNS 引擎启动之前（或者使用配置文件中写死的系统标准 DNS 快速取得 IP），属于网络栈底层基础设施建连。3. 这种“App 自身的 DNS 建立流量”不会经过 Quantumult X 的分流匹配引擎，因此不会作为普通 HTTP/TCP 请求记录在“网络活动”日志中。
#   - 可能丢失国内 CDN 优化（如阿里云 CDN）
# - doh-server=https://cloudflare-dns.com/dns-query：Cloudflare DoH，注重速度和隐私
# - doh-server=https://dns.alidns.com/dns-query：阿里 DoH，国内服务，注重 CDN 优化

# 使用 Cloudflare 官方 IP 形式的 DoH 地址
# 或使用备用 IP：https://1.0.0.1/dns-query
;doh-server = https://cloudflare-dns.com/dns-query

doh-server=https://dns.alidns.com/dns-query

# 优先使用 DoH3
# - 作用：启用 DNS over HTTP/3（基于 UDP 的 QUIC 协议），比 DoH（HTTP/2）更快、更高效
# - 注意事项：
#   - 需网络和服务器支持 HTTP/3（如 Cloudflare）
#   - 若 DoH3 不可用，自动回退到 DoH（HTTP/2）
# - 适用场景：优化 `cp.cloudflare.com` 和 `x.ai` 的解析速度
prefer-doh3

# 规避 IPv4 响应
# - 作用：当域名被拒绝（如 [filter_local] 的 reject 规则或策略组未匹配）时，返回指定的 IPv4 地址
# - 127.0.0.1：本地环回地址，阻止连接
# - 0.0.0.0：无效地址，阻止连接
# - 适用场景：防止被拒绝的域名连接到意外服务器，保护隐私
# - 注意事项：确保 `cp.cloudflare.com` 和 `x.ai` 不被拒绝，正常解析到正确 IP（如 104.16.123.456, 154.28.105.46）
circumvent-ipv4-answer = 127.0.0.1, 0.0.0.0

# 规避 IPv6 响应
# - 作用：当域名被拒绝时，返回指定的 IPv6 地址
# - ::1：IPv6 本地环回地址，阻止连接
# - ::：IPv6 零地址，阻止连接
# - 注意事项：因 no-ipv6 已启用，此配置无实际作用，可删除
circumvent-ipv6-answer = ::1, ::

# 补充配置项（未使用，以下为建议）
# 特定域名 IP 映射
# - 作用：强制将域名映射到指定 IP，绕过 DNS 查询，加快解析速度
# - 适用场景：确保关键服务（如 Google 推送）解析到固定 IP
# - 示例：address=/mtalk.google.com/108.177.125.188 将 Google 推送服务映射到指定 IP
;address=/mtalk.google.com/108.177.125.188
# - 注意事项：验证 IP 是否有效（如 ping 108.177.125.188），确保不在 excluded_routes（如 10.0.0.0/8）

# 系统 DNS 解析
# - 作用：将特定域名（如路由器管理页面）交给系统 DNS 解析，绕过 Quantumult X 的 DNS 设置
# - 适用场景：本地设备（如 LocalVPS 192.168.1.100 或路由器 amplifi.lan）直连
# - 示例：server=/amplifi.lan/system 确保路由器管理页面使用系统 DNS
;server=/amplifi.lan/system
;server=/router.asus.com/system
;server=/miwifi.com/system
# - 注意事项：确保 LocalVPS（如 192.168.1.100）域名（如 local.vps）配置系统 DNS（如 server=/local.vps/system）

