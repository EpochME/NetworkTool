[mitm]

# MITM（中间人）相关设置
# 用于解密 HTTPS 流量，实现 rewrite_local、重写规则、去广告、响应修改等功能
# 前提：必须先安装并信任 Quantumult X 的 CA 证书

# 是否跳过对原始服务器证书的验证
# - 功能：控制 Quantumult X 在执行 MITM 时，是否严格校验原始服务器的 SSL/TLS 证书
# - false（推荐 / 当前设置）：正常验证原始证书
#   - 只有证书有效（未过期、未吊销、域名匹配等）才会用 QX 自签 CA 完成 MITM
#   - 安全性更高，兼容性更好
# - true：强制跳过原始证书验证
#   - 即使原始证书有问题（自签名、过期、域名不匹配、内网证书等）也继续 MITM
#   - 适用于调试、特殊内网服务、自建节点、证书配置异常的网站
# - 风险提示：
#   - 开启 true 后更容易遭受中间人攻击（不过你已在用 MITM，额外风险有限）
#   - 大多数去广告、解锁、UA 修改场景无需开启，保持 false 即可
# - 建议：日常使用保持 false；仅在出现“证书不信任”“连接失败”且明确是服务器证书问题时才临时改为 true 测试
skip_validating_cert = false

# 是否强制只使用 TLS SNI 进行 MITM 匹配（忽略目标 IP）
# - 功能：决定 Quantumult X 如何判断是否对连接执行 MITM
# - false（推荐 / 当前设置）：默认行为（最兼容）
#   - 同时检查两项：
#     1. TLS 握手中的 SNI 域名（最常见、最可靠）
#     2. 实际连接的目标 IP 是否解析匹配 hostname 列表中的域名
#   - 适用大部分规则集和 hostname 通配符场景
# - true：严格只看 SNI，完全忽略目标 IP
#   - 即使 IP 解析后匹配 hostname 列表，但 SNI 不在列表中 → 不执行 MITM
#   - 适用于：
#     - 同一 IP 承载多个域名（常见于 CDN），需精确区分 SNI
#     - 避免误对某些域名做 MITM 导致证书弹窗、App 崩溃
#     - hostname 列表包含大量通配符（如 *.google.com、*.youtube.com）时更精准
# - 建议：
#   - 日常使用保持 false，兼容性最佳
#   - 仅在遇到“同一个 IP 多个域名误 MITM”“证书警告”“特定 App 连接异常”时才改为 true
# - 注意事项：
#   - 开启 true 后，如果 App 不发送 SNI（极少数老旧协议或特殊实现），MITM 将完全失效
force_sni_domain_name = false

# 需要执行 MITM 的主机名列表（支持通配符 *）
# - 格式：域名或 -前缀域名（- 表示否定，不做 MITM）
# - 当前列表主要针对字节系（抖音/头条）、百度系、部分谷歌服务等
# - 典型用途：配合 rewrite_local 实现去广告、响应篡改、UA 修改等
hostname = 