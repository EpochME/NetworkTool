[filter_local]
#ip-cidr：指定 IP 地址或 IP 段的分流规则。192.168.0.190/32：表示单个 IP 地址（/32 表示精确匹配单个 IP）。direct：表示该 IP 的流量走直连（不通过代理）。
;ip-cidr, 192.168.0.190/32, direct

#本地分流规则(对于完全相同的某条规则，本地规则将覆盖远程规则，优先生效)
// 如开启Quantumult X“其他设置”中的  “分流匹配优化” 选项，则匹配优先级如下
// host > host-suffix > host-keyword(wildcard) > geoip = ip-cidr > user-agennt

// 完整域名匹配
;host, www.google.com, proxy
// 域名关键词匹配
;host-keyword, adsite, reject
// 域名后缀匹配
;host-suffix, googleapis.com, proxy
// 域名通配符匹配
;host-wildcard, *abc.com, proxy
// User-Agent 匹配
;user-agent, ?abc*, proxy

//强制分流走蜂窝网络
;host-suffix, googleapis.com, proxy, force-cellular
//让分流走蜂窝网络跟 Wi-Fi 中的优选结果
;host-suffix, googleapis.com, proxy, multi-interface
//让分流走蜂窝网络跟 Wi-Fi 中的负载均衡，提供更大带宽出入接口
;host-suffix, googleapis.com, proxy, multi-interface-balance
//指定分流走特定网络接口
;host-suffix, googleapis.com, proxy, via-interface=pdp_ip0

// %TUN% 参数，回传给 Quantumult X 接口，可用于曲线实现代理链功能
;host-suffix, example.com, ServerA, via-interface=%TUN%
;ip-cidr, ServerA's IP Range, ServerB

// ip 规则
;ip-cidr, 10.0.0.0/8, direct
;ip-cidr, 127.0.0.0/8, direct
;ip-cidr, 172.16.0.0/12, direct
;ip-cidr, 192.168.0.0/16, direct
;ip-cidr, 224.0.0.0/24, direct

//ipv6 规则
;ip6-cidr, 2001:4860:4860::8888/32, direct

# 已采用 ip 池数据，因此注释掉 geoip cn
;geoip, cn, direct

# 1.0.28 build628 后支持如下的geoip库写法（需 GEO-IP 库支持）
;geoip, netflix, proxy

#不在上述规则中(远程以及本地)的剩余请求，将走final 指定的节点/策略，这里即是 → 🕹 终极清单, 请根据自己的需求来选择直连或节点、策略
;final, 🕹 终极清单


# > 屏蔽 ocsp
# OCSP(Online Certificate Status Protocol stapling)苹果验证应用可信的公证服务器，用户每次打开或执行一个程序，系统都会将其哈希值发送到该服务器。OCSP请求是明文传输。
host-keyword, ocsp, reject
host, ocsp.pki.goog, reject

# > 绕过企业证书过期
host, ocsp.apple.com, reject
host, ocsp2.apple.com, reject

# > Quantumult X验证收据
-host, receiptcheck.quantumult.app, reject

# > Quantumult X验证服务器
host, activation.crossutility.com, reject

#api.revenuecat.com 是 Revenue Cat公司的一个 域名。Revenue Cat 是一个为移动应用开发者提供订阅 管理和收入分析服务的公司。它帮助开发者轻松管理应用内订阅，并提供相关的数据分析工具。通过这个API，开发者可以集成和管理他们的应用内购买和订阅服务。
;host, api.revenuecat.com, proxy
;host, us.i.posthog.com, proxy

# > 请求的目标服务器位于本地网络中，即在同一局域网或本地区域内，直接连接到目标地址，而不经过代理服务器。这样可以确保在访问本地资源或局域网内部服务时，不会经过额外的中间代理，提高访问的效率和速度。
host-suffix, local, direct
;ip-cidr, 10.0.0.0/8, direct
;ip-cidr, 127.0.0.0/8, direct
;ip-cidr, 172.16.0.0/12, direct
;ip-cidr, 192.168.0.0/16, direct
;ip-cidr, 224.0.0.0/24, direct
;geoip, cn, direct
final, 漏网之鱼




